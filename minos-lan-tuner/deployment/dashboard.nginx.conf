# Example LAN reverse proxy. Postgres stays on 127.0.0.1:5432 and is not listed here.
# Point a private DNS name at the Ubuntu coordinator and install a certificate
# you trust on the laptops that open the dashboard. Then set DASHBOARD_COOKIE_SECURE=1.

server {
    listen 443 ssl;
    server_name tuner.lan;

    ssl_certificate     /etc/minos/tuner.lan.crt;
    ssl_certificate_key /etc/minos/tuner.lan.key;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
