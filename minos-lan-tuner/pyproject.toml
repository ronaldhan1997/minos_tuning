[project]
name = "minos-lan-tuner"
version = "0.1.0"
description = "LAN distributed GATK HaplotypeCaller tuner for Minos SN107. Does not submit to live rounds."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "optuna>=4",
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
minosctl = "apps.coordinator.cli:main"
minos-worker = "apps.worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "shared*", "integrations*", "datasets*", "database*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_minos: Docker images and a local authorized practice sample",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["apps", "shared", "integrations", "datasets", "database"]
ignore_missing_imports = true
check_untyped_defs = false
